<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
:root { --ink: #0A0F1F; --glow: #FFD43B; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070A16; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; color: #fff;
  font-family: 'Inter', sans-serif; }
.abs { position: absolute; }
.anton { font-family: 'Anton', 'Inter', sans-serif; font-weight: 400; text-transform: uppercase; }
.emoji { font-family: 'Noto Color Emoji', sans-serif; }

/* ---------- fond ---------- */
#bg { inset: 0; background: linear-gradient(180deg, #0B1228 0%, #070A16 62%, #05070F 100%); }
#glow { left: -260px; top: -40px; width: 1600px; height: 1600px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--glow) 46%, transparent) 0%,
    color-mix(in srgb, var(--glow) 14%, transparent) 38%, transparent 66%); }
#glow2 { left: 140px; top: 1250px; width: 800px; height: 800px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--glow) 16%, transparent) 0%, transparent 62%); }
#dots { inset: -60px 0 0 0; height: 2040px; background-image: radial-gradient(rgba(255,255,255,.085) 2px, transparent 2.6px);
  background-size: 54px 54px; }
#vignette { inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%); }
#flash { inset: 0; background: #fff; opacity: 0; }

/* ---------- échelle des niveaux ---------- */
#ladder { left: 56px; top: 236px; width: 968px; height: 22px; display: flex; gap: 12px; }
.pip { flex: 1; height: 22px; border-radius: 11px; background: rgba(255,255,255,.16); }

/* ---------- écran d'un niveau ---------- */
.level { inset: 0; opacity: 0; }
.lvl { left: 76px; top: 292px; font-size: 156px; line-height: 1; letter-spacing: 2px; white-space: nowrap;
  transform-origin: 0% 60%; text-shadow: 0 10px 0 rgba(0,0,0,.35); }
.lvl .num { margin-left: 26px; }
.pill { left: 80px; top: 474px; font-size: 48px; line-height: 1; letter-spacing: 3px; padding: 12px 30px 14px;
  border-radius: 999px; color: var(--ink); white-space: nowrap; transform-origin: 0% 50%; }
.ring { left: 826px; top: 306px; width: 180px; height: 180px; }
.ring svg { position: absolute; inset: 0; }
.ring .digit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 96px; line-height: 1; padding-bottom: 4px; }
.prompt { left: 0; top: 592px; width: 1080px; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: 7px;
  text-transform: uppercase; }
.visual { left: 130px; top: 652px; width: 820px; height: 560px; }
.visual .inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.visual svg { position: absolute; inset: 0; overflow: visible; }
.flagbox { border-radius: 26px; overflow: hidden; box-shadow: 0 18px 0 rgba(0,0,0,.4), 0 0 0 6px rgba(255,255,255,.92); line-height: 0; }
.flagbox img { display: block; }
.qcol { display: flex; flex-direction: column; align-items: center; gap: 46px; }
.qtext { text-align: center; white-space: nowrap; font-size: 150px; line-height: 1.04; letter-spacing: 1px; text-shadow: 0 9px 0 rgba(0,0,0,.35); }
.qtext small { display: block; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 7px;
  opacity: .7; margin-bottom: 18px; text-shadow: none; }
.burst { left: 410px; top: 280px; width: 0; height: 0; }
.burst i { position: absolute; left: -7px; top: -30px; width: 14px; height: 60px; border-radius: 7px; transform-origin: 50% 50%; }
.bar { left: 110px; top: 1240px; width: 860px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.14); overflow: hidden; }
.bar b { display: block; width: 100%; height: 100%; border-radius: 8px; transform-origin: 0 50%; }
.hintwrap { left: 0; top: 1292px; width: 1080px; display: flex; justify-content: center; }
.hint { font-weight: 800; font-size: 42px; letter-spacing: 2px; text-transform: uppercase; padding: 20px 38px;
  border-radius: 999px; background: rgba(255,255,255,.1); border: 3px solid rgba(255,255,255,.3); white-space: nowrap; }
.hint .k { opacity: .65; margin: 0 12px 0 14px; }
.answer { left: 0; top: 1256px; width: 1080px; }
.answer .rowwrap { display: flex; justify-content: center; height: 164px; align-items: center; }
.answer .row { display: flex; align-items: center; gap: 30px; white-space: nowrap; }
.answer .aflag { height: 112px; width: 149px; border-radius: 14px; box-shadow: 0 0 0 4px rgba(255,255,255,.92), 0 10px 0 rgba(0,0,0,.35); }
.answer .aname { font-size: 156px; line-height: 1; letter-spacing: 2px; text-shadow: 0 10px 0 rgba(0,0,0,.35); }
.answer .fact { margin-top: 16px; display: flex; justify-content: center; font-weight: 700; font-size: 40px; color: rgba(255,255,255,.9); white-space: nowrap; }

/* ---------- intro ---------- */
#intro { inset: 0; }
.kicker { left: 0; top: 262px; width: 1080px; display: flex; justify-content: center; }
.kicker span { font-size: 44px; letter-spacing: 6px; padding: 10px 30px 12px; border-radius: 999px; color: var(--ink); background: #FFD43B; }
.titlebox { left: 0; top: 356px; width: 1080px; }
.tl { display: flex; justify-content: center; height: 178px; align-items: center; }
.tl span { font-size: 174px; line-height: 1; letter-spacing: 2px; white-space: nowrap; text-shadow: 0 11px 0 rgba(0,0,0,.4); }
.cycle { left: 190px; top: 912px; width: 700px; height: 370px; }
.cycle .cy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
.cycle svg { overflow: visible; }
.teaser { left: 0; top: 1290px; width: 1080px; display: flex; justify-content: center; }
.teaser span { font-size: 58px; letter-spacing: 3px; padding: 10px 34px 14px; border-radius: 999px; color: #fff; white-space: nowrap; }
.sub { left: 0; top: 1436px; width: 1080px; display: flex; justify-content: center; font-weight: 800; font-size: 40px; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,.92); white-space: nowrap; }

/* ---------- outro ---------- */
#outro { inset: 0; opacity: 0; }
.otitle { left: 0; top: 330px; width: 1080px; }
.tiles { left: 100px; top: 790px; width: 880px; display: grid; grid-template-columns: repeat(5, 160px); gap: 20px; }
.tile { width: 160px; height: 160px; border-radius: 30px; display: flex; align-items: center; justify-content: center;
  font-size: 104px; line-height: 1; color: var(--ink); padding-bottom: 6px; box-shadow: 0 10px 0 rgba(0,0,0,.35); }
.cta { left: 0; top: 1196px; width: 1080px; display: flex; justify-content: center; }
.cta span { font-size: 84px; line-height: 1; letter-spacing: 2px; white-space: nowrap; text-shadow: 0 8px 0 rgba(0,0,0,.35); }
.cta2 { left: 0; top: 1326px; width: 1080px; display: flex; justify-content: center; }
.cta2 span { font-size: 50px; letter-spacing: 3px; padding: 14px 38px 18px; border-radius: 999px; color: var(--ink); background: #FFD43B; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div id="glow" class="abs"></div>
  <div id="glow2" class="abs"></div>
  <div id="dots" class="abs"></div>
  <div id="vignette" class="abs"></div>
  <div id="ladder" class="abs"></div>
  <div id="intro" class="abs"></div>
  <div id="levels"></div>
  <div id="outro" class="abs"></div>
  <div id="flash" class="abs"></div>
</div>
<script>
const TL = /*__DATA__*/null;

/* ---------- petits outils ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = (k) => Math.pow(clamp(k), 3);
const easeBack = (k) => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const prog = (t, start, dur) => clamp((t - start) / dur);
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const tf = (e, { x = 0, y = 0, s = 1, sx = null, r = 0, o = null } = {}) => {
  e.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${(sx ?? s).toFixed(4)},${s.toFixed(4)})`;
  if (o != null) e.style.opacity = clamp(o).toFixed(3);
};
const BRAND = '#FFD43B', RED = '#FF3B5C';
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// Les emojis passent par la police couleur, le reste par la police du bloc.
const rich = (s) => esc(s).replace(/(\p{Extended_Pictographic}️?)/gu, '<span class="emoji">$1</span>');
const flagUri = (svg) => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

function shapeSvg(sh, w, h, fill) {
  // Silhouette + ombre portée dure, mise à l'échelle dans w × h.
  const k = Math.min(w / sh.w, h / sh.h);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${sh.w} ${sh.h}" preserveAspectRatio="xMidYMid meet">
    <path d="${sh.d}" transform="translate(0,${(13 / k).toFixed(1)})" fill="rgba(0,0,0,.42)" fill-rule="evenodd"/>
    <path class="shape" d="${sh.d}" fill="${fill}" stroke="${fill}" stroke-width="${(2.2 / k).toFixed(2)}" stroke-linejoin="round" fill-rule="evenodd"/>
  </svg>`;
}
// Réduit un texte trop large pour tenir dans maxW (sans toucher aux animations du parent).
function fit(e, maxW, display = 'inline-block') {
  if (display) e.style.display = display;
  const w = e.getBoundingClientRect().width;
  if (w > maxW) { e.style.transformOrigin = '50% 50%'; e.style.transform = `scale(${(maxW / w).toFixed(4)})`; }
}

/* ---------- construction de la scène ---------- */
const $ = (id) => document.getElementById(id);
const R = {};          // références aux éléments animés
function build() {
  const L = TL.levels;
  // échelle
  R.pips = L.map(() => $('ladder').appendChild(el('div', 'pip')));

  // intro
  const I = TL.intro, intro = $('intro');
  intro.appendChild(el('div', 'abs kicker', `<span class="anton">${rich(I.kicker)}</span>`));
  const tb = intro.appendChild(el('div', 'abs titlebox'));
  tb.style.top = (356 + (3 - I.lines.length) * 89) + 'px';
  R.introLines = I.lines.map((txt, k) => {
    const row = tb.appendChild(el('div', 'tl'));
    const sp = row.appendChild(el('span', 'anton', rich(txt)));
    if (k === I.accentLine) sp.style.color = BRAND;
    return row;
  });
  const cyc = intro.appendChild(el('div', 'abs cycle'));
  R.cycle = L.map((lv) => {
    const c = cyc.appendChild(el('div', 'cy'));
    if (TL.mode === 'shape') c.innerHTML = shapeSvg(lv.shape, 700, 370, lv.color);
    else c.innerHTML = `<div class="flagbox"><img src="${flagUri(lv.flag)}" width="460" height="345"></div>`;
    return c;
  });
  R.teaser = intro.appendChild(el('div', 'abs teaser', `<span class="anton" style="background:${L[L.length - 1].color}">${rich(I.teaser)}</span>`));
  R.sub = intro.appendChild(el('div', 'abs sub', `<span>${rich(I.sub)}</span>`));
  R.intro = intro;

  // niveaux
  R.levels = L.map((lv) => {
    const root = $('levels').appendChild(el('div', 'abs level'));
    const o = { root };
    o.lvl = root.appendChild(el('div', 'abs lvl anton', `NIVEAU<span class="num" style="color:${lv.color}">${lv.n}</span>`));
    o.pill = root.appendChild(el('div', 'abs pill anton', rich(lv.label)));
    o.pill.style.background = lv.color;
    o.ring = root.appendChild(el('div', 'abs ring', `
      <svg viewBox="0 0 180 180">
        <circle class="disc" cx="90" cy="90" r="76" fill="rgba(7,10,22,.55)"/>
        <circle cx="90" cy="90" r="76" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="14"/>
        <circle class="arc" cx="90" cy="90" r="76" fill="none" stroke="${lv.color}" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="477.52" stroke-dashoffset="0" transform="rotate(-90 90 90)"/>
        <path class="check" d="M56 93 L80 117 L126 67" fill="none" stroke="${'#0A0F1F'}" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
      </svg><div class="digit anton">${lv.timer}</div>`));
    o.disc = o.ring.querySelector('.disc'); o.arc = o.ring.querySelector('.arc');
    o.check = o.ring.querySelector('.check'); o.digit = o.ring.querySelector('.digit');
    o.prompt = root.appendChild(el('div', 'abs prompt', rich(TL.prompt)));
    o.visual = root.appendChild(el('div', 'abs visual'));
    const inner = o.visual.appendChild(el('div', 'inner'));
    if (TL.mode === 'shape') {
      inner.innerHTML = shapeSvg(lv.shape, 820, 560, '#ffffff');
      o.shape = inner.querySelector('.shape');
    } else if (TL.mode === 'flag') {
      inner.innerHTML = `<div class="flagbox"><img src="${flagUri(lv.flag)}" width="720" height="540"></div>`;
    } else {
      inner.innerHTML = `<div class="qcol"><div class="flagbox"><img src="${flagUri(lv.flag)}" width="340" height="255"></div>
        <div class="qtext anton"><small>${rich(lv.qsmall || '')}</small><span class="qt">${rich(lv.question)}</span></div></div>`;
      o.qt = inner.querySelector('.qt');
    }
    const burst = o.visual.appendChild(el('div', 'abs burst'));
    o.burst = Array.from({ length: 16 }, () => { const i = burst.appendChild(el('i')); i.style.background = lv.color; return i; });
    o.bar = root.appendChild(el('div', 'abs bar', '<b></b>')); o.barFill = o.bar.firstChild; o.barFill.style.background = lv.color;
    const hw = root.appendChild(el('div', 'abs hintwrap'));
    o.hint = hw.appendChild(el('div'));
    o.hintIn = o.hint.appendChild(el('div', 'hint', `<span class="emoji">💡</span><span class="k">INDICE</span>${rich(lv.hint)}`));
    o.answer = root.appendChild(el('div', 'abs answer'));
    const rw = o.answer.appendChild(el('div', 'rowwrap'));
    o.row = rw.appendChild(el('div', 'row'));
    o.rowIn = o.row.appendChild(el('div', 'row'));
    if (TL.mode === 'shape' && lv.flag) { const im = o.rowIn.appendChild(el('img', 'aflag')); im.src = flagUri(lv.flag); }
    const nm = o.rowIn.appendChild(el('div', 'aname anton', rich(lv.name))); nm.style.color = lv.color;
    o.fact = o.answer.appendChild(el('div', 'fact', `<span>${rich(lv.fact)}</span>`));
    return o;
  });

  // outro
  const O = TL.outro, outro = $('outro');
  const ot = outro.appendChild(el('div', 'abs otitle'));
  R.outroLines = O.lines.map((txt, k) => {
    const row = ot.appendChild(el('div', 'tl'));
    const sp = row.appendChild(el('span', 'anton', rich(txt)));
    if (k === O.accentLine) sp.style.color = BRAND;
    return row;
  });
  const tiles = outro.appendChild(el('div', 'abs tiles'));
  R.tiles = L.map((lv) => { const t = tiles.appendChild(el('div', 'tile anton', String(lv.n))); t.style.background = lv.color; return t; });
  R.cta = outro.appendChild(el('div', 'abs cta', `<span class="anton">${rich(O.cta)}</span>`));
  R.cta2 = outro.appendChild(el('div', 'abs cta2', `<span class="anton">${rich(O.cta2)}</span>`));
  R.outro = outro;
}

function fitAll() {
  // Mesures faites une fois les polices chargées, tous les écrans visibles et sans transformation.
  [...R.introLines, ...R.outroLines].forEach((row) => fit(row.firstChild, 930));
  R.levels.forEach((o) => { o.root.style.opacity = 1; fit(o.rowIn, 800, null); if (o.qt) fit(o.qt, 800); fit(o.fact.firstChild, 900, null); fit(o.hintIn, 880, null); o.root.style.opacity = 0; });
  $('outro').style.opacity = 1; fit(R.cta.firstChild, 900); fit(R.cta2.firstChild, 900); $('outro').style.opacity = 0;
  fit(R.sub.firstChild, 900, null);
}

/* ---------- rendu d'une image à l'instant t (fonction pure du temps) ---------- */
function renderAt(t) {
  const L = TL.levels, I = TL.intro, O = TL.outro;
  const X = 0.3;                                   // durée du chevauchement sortie / entrée
  const stage = document.documentElement.style;

  // --- couleur d'ambiance : fondu d'un niveau à l'autre
  let glow = BRAND;
  L.forEach((lv, i) => { if (t >= lv.start) { const prev = i ? L[i - 1].color : BRAND; glow = mix(prev, lv.color, prog(t, lv.start, 0.35)); } });
  if (t >= O.start) glow = mix(L[L.length - 1].color, BRAND, prog(t, O.start, 0.4));
  stage.setProperty('--glow', glow);
  $('dots').style.transform = `translateY(${(-(t * 16) % 54).toFixed(2)}px)`;
  $('glow').style.transform = `scale(${(1 + 0.05 * Math.sin(t * 1.3)).toFixed(4)})`;

  // --- intro
  if (t < I.end + X) {
    const out = prog(t, I.end, X);
    tf(R.intro, { x: -200 * easeIn(out), o: 1 - out });
    R.introLines.forEach((row, k) => tf(row, { s: lerp(0.84, 1, easeBack(prog(t, k * 0.06, 0.34))) }));
    const step = I.cycleStep, n = L.length;
    const idx = Math.min(n - 1, Math.floor(t / step));
    R.cycle.forEach((c, i) => {
      if (i !== idx) { c.style.opacity = 0; return; }
      const local = t - i * step;
      const hold = i === n - 1;
      tf(c, { s: hold ? lerp(0.8, 1, easeBack(prog(local, 0, 0.4))) + 0.02 * Math.sin(local * 3) : lerp(0.86, 1, easeOut(prog(local, 0, step))), o: 1 });
    });
    const tz = t - (n - 1) * step;
    tf(R.teaser, { s: easeBack(prog(tz, 0.1, 0.35)) * (1 + 0.035 * Math.sin(Math.max(0, tz) * 7)), o: prog(tz, 0.1, 0.1) });
    tf(R.sub, { o: 1, s: 1 });
  } else R.intro.style.opacity = 0;

  // --- échelle
  const ladderIn = prog(t, L[0].start, 0.35), ladderOut = prog(t, O.start, 0.3);
  $('ladder').style.opacity = (ladderIn * (1 - ladderOut)).toFixed(3);
  R.pips.forEach((p, i) => {
    const lv = L[i];
    if (t >= lv.rev) { const k = prog(t, lv.rev, 0.3); p.style.background = lv.color; tf(p, { s: 1 + 0.9 * (1 - easeOut(k)) * (k < 1 ? 1 : 0) }); }
    else if (t >= lv.start) { p.style.background = `rgba(255,255,255,${(0.42 + 0.22 * Math.sin((t - lv.start) * 7)).toFixed(3)})`; tf(p, { s: 1 }); }
    else { p.style.background = 'rgba(255,255,255,.16)'; tf(p, { s: 1 }); }
  });

  // --- niveaux
  let flash = 0;
  L.forEach((lv, i) => {
    const o = R.levels[i];
    if (t < lv.start || t >= lv.end + X) { o.root.style.opacity = 0; return; }
    const u = t - lv.start, c = t - lv.cd, r = t - lv.rev, out = prog(t, lv.end, X);
    const revealed = r >= 0, counting = c >= 0 && !revealed;
    // conteneur : entre par la droite, sort par la gauche
    tf(o.root, { x: 200 * (1 - easeOut(prog(u, 0, 0.32))) - 200 * easeIn(out), o: prog(u, 0, 0.16) * (1 - out) });
    tf(o.lvl, { s: lerp(1.55, 1, easeBack(prog(u, 0.04, 0.34))), o: prog(u, 0.04, 0.1) });
    tf(o.pill, { s: easeBack(prog(u, 0.2, 0.26)) });
    tf(o.ring, { s: easeBack(prog(u, 0.24, 0.26)) * (revealed ? 1 + 0.22 * (1 - easeOut(prog(r, 0, 0.3))) : 1) });
    o.prompt.style.opacity = (0.66 * prog(u, 0.2, 0.2) * (1 - prog(r, 0, 0.15))).toFixed(3);

    // minuteur
    const left = clamp(lv.timer - c, 0, lv.timer);
    const frac = c < 0 ? 1 : left / lv.timer;
    const danger = counting && left <= 1.0;
    o.arc.setAttribute('stroke-dashoffset', (477.52 * (1 - (revealed ? 1 : frac))).toFixed(2));
    o.arc.setAttribute('stroke', danger ? RED : lv.color);
    o.disc.setAttribute('fill', revealed ? lv.color : 'rgba(7,10,22,.55)');
    o.check.setAttribute('opacity', revealed ? 1 : 0);
    o.digit.style.opacity = revealed ? 0 : 1;
    o.digit.textContent = String(Math.max(1, Math.ceil(left - 1e-6)));
    o.digit.style.color = danger ? RED : '#fff';
    const beat = c < 0 ? 1 : (c % 1);
    tf(o.digit, { s: 1 + 0.3 * (1 - easeOut(beat / 0.28)), x: danger ? 3 * Math.sin(c * 70) : 0 });
    tf(o.barFill, { sx: revealed ? 0 : frac, s: 1 });
    o.barFill.style.background = danger ? RED : lv.color;
    o.bar.style.opacity = (prog(u, 0.26, 0.2) * (1 - prog(r, 0, 0.15))).toFixed(3);

    // visuel central
    const grow = c < 0 ? 0 : clamp(c / lv.timer);
    const pop = revealed ? easeBack(prog(r, 0, 0.36)) : 0;   // à la révélation : léger zoom, et le visuel remonte pour laisser la place au nom
    tf(o.visual, { s: lerp(0.55, 1, easeBack(prog(u, 0.1, 0.4))) * (1 + 0.045 * grow + 0.06 * pop), y: 5 * Math.sin(u * 1.7) - 26 * pop, o: prog(u, 0.1, 0.14) });
    if (o.shape) { const col = revealed ? lv.color : '#ffffff'; o.shape.setAttribute('fill', col); o.shape.setAttribute('stroke', col); }
    o.burst.forEach((b, k) => {
      const a = (k / o.burst.length) * 360 + 11, q = prog(r, 0, 0.62), dist = 270 + 190 * easeOut(q);
      b.style.opacity = revealed ? (1 - q).toFixed(3) : 0;
      b.style.transform = `rotate(${a}deg) translateY(${-dist.toFixed(1)}px) scaleY(${(1 - 0.5 * q).toFixed(3)})`;
    });

    // indice puis réponse
    const h = t - lv.hintAt;
    tf(o.hint, { y: 54 * (1 - easeBack(prog(h, 0, 0.36))), s: 1 + 0.12 * (1 - easeOut(prog(h, 0, 0.3))) * (h >= 0 ? 1 : 0), o: prog(h, 0, 0.14) * (1 - prog(r, 0, 0.12)) });
    tf(o.row, { s: lerp(1.7, 1, easeBack(prog(r, 0.04, 0.36))), o: prog(r, 0.04, 0.1) });
    tf(o.fact, { y: 26 * (1 - easeOut(prog(r, 0.42, 0.3))), o: prog(r, 0.42, 0.22) });
    if (revealed) flash = Math.max(flash, 0.5 * (1 - prog(r, 0, 0.28)));
  });
  $('flash').style.opacity = flash.toFixed(3);

  // --- outro
  if (t >= O.start) {
    const u = t - O.start;
    tf(R.outro, { x: 200 * (1 - easeOut(prog(u, 0, 0.32))), o: prog(u, 0, 0.16) });
    R.outroLines.forEach((row, k) => tf(row, { s: lerp(1.5, 1, easeBack(prog(u, 0.05 + k * 0.1, 0.34))), o: prog(u, 0.05 + k * 0.1, 0.1) }));
    R.tiles.forEach((tile, i) => {
      const a = 0.45 + i * 0.11;
      const loop = u > a + 0.5 ? 0.05 * Math.max(0, Math.sin((u - a) * 5 - i * 0.6)) : 0;
      tf(tile, { s: easeBack(prog(u, a, 0.3)) * (1 + loop), o: prog(u, a, 0.08) });
    });
    tf(R.cta, { s: easeBack(prog(u, 1.0, 0.36)) * (1 + 0.03 * Math.sin(u * 6)), o: prog(u, 1.0, 0.1) });
    tf(R.cta2, { s: easeBack(prog(u, 1.5, 0.36)), o: prog(u, 1.5, 0.1) });
  } else R.outro.style.opacity = 0;
}

async function init() {
  build();
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  fitAll();
  renderAt(0);
  return true;
}
window.init = init; window.renderAt = renderAt;
</script>
</body>
